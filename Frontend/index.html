<!doctype html>
<html lang="en">

<head>
  <script>
    (() => {
      try {
        const isDark = localStorage.getItem("taskflow-theme") === "dark";

        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark
          ? "dark"
          : "light";
      } catch {
        // Light is the default if browser storage is unavailable.
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/3.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Flow</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
